[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hermes-tool-forge"
version = "1.0.0"
description = "Runtime tool forging plugin for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[tool.setuptools]
packages = ["tool_forge"]